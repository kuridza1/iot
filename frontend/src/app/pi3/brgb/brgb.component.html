<div class="widget-frame">
  <div class="top">
    <div class="title">BRGB</div>
    <span class="dot" [class.on]="connected" title="{{ connected ? 'Live' : 'Reconnecting…' }}"></span>
  </div>

  <div class="lights" [class.busy]="busy">
    <button class="lamp r" [class.on]="r" (click)="toggle('r')" type="button" aria-label="Red"></button>
    <button class="lamp g" [class.on]="g" (click)="toggle('g')" type="button" aria-label="Green"></button>
    <button class="lamp b" [class.on]="b" (click)="toggle('b')" type="button" aria-label="Blue"></button>
  </div>

</div>
