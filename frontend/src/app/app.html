<div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px; align-items:start;">
  <div>
    <app-floorplan
      [(selectedPi)]="selectedPi"
      [(selectedElement)]="selectedElement"
    ></app-floorplan>
  </div>

    <div style="margin-top:16px;">
       
      <app-grafana-embed [url]="grafanaUrl"></app-grafana-embed>
    </div>
    <div style="display:flex; gap:16px; align-items: center;">
      <app-dms
        [apiBase]="apiBase"
        [device]="selectedPi"
      ></app-dms>

      <app-security-status
          [apiBase]="apiBase"
          [device]="selectedPi"
        ></app-security-status>

        <app-ds1
          [apiBase]="apiBase"
          [device]="selectedPi"
        ></app-ds1>


    </div>

</div>
