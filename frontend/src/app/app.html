<div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px; align-items:start;">

  <!-- Floorplan -->
  <div>
    <app-floorplan
      [(selectedPi)]="selectedPi"
      [(selectedElement)]="selectedElement"
    ></app-floorplan>
  </div>

  <!-- Grafana -->
  <div style="margin-top:16px;">
    <app-grafana-embed [url]="grafanaUrl"></app-grafana-embed>
  </div>

  <!-- PI1 specifični uređaji — nestaju kad se selektuje drugi PI -->
  <div *ngIf="selectedPi === 'PI1'" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
    <app-dms
      [apiBase]="apiBase"
      [device]="selectedPi"
    ></app-dms>

    <app-security-status
      [apiBase]="apiBase"
      [device]="selectedPi"
    ></app-security-status>

    <app-ds1
      [apiBase]="apiBase"
      [device]="selectedPi"
    ></app-ds1>

  </div>
    <app-web-cam>
      
    </app-web-cam>
</div>
