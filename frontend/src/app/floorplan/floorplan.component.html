<div class="plan">
    <div class="plan-frame">
        <img class="plan-img" src="house-plan.png" />
      <app-dl
            *ngIf="selectedPi === 'PI1'"
            [apiBase]="apiBase"
            [device]="'PI1'"
            top="78%"
            left="57.5%"
            [sizePx]="18"
          ></app-dl>

  <svg class="overlay" viewBox="0 0 1000 800" preserveAspectRatio="none">
    <g *ngFor="let pane of panes">
      <path
        class="pane"
        [attr.d]="pane.pathD"
        [style.--pane-color]="pane.color"
        [class.selected]="selectedPi === pane.id"
        (click)="selectPi($event, pane.id)"
      ></path>

      <text
        class="pane-label"
        [attr.x]="pane.labelPos.x"
        [attr.y]="pane.labelPos.y"
        [class.selected]="selectedPi === pane.id"
      >
        {{ pane.label }}
      </text>
    </g>
  </svg>
      </div>

  <button
    *ngFor="let e of selectedElements"
    class="hotspot el"
    [style.left.%]="e.xPct"
    [style.top.%]="e.yPct"
    (click)="selectElement($event, e.id)"
    [class.selected]="selectedElement === e.id"
    [attr.title]="e.label"
  >
    {{ e.id }}
  </button>
</div>
