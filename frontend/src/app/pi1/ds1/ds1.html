<div class="lock-shell">

  <div class="lock-header">

    <span class="lock-status-dot"
      [class.unlocked]="lockState === true"
      [class.locked]="lockState === false">
    </span>
  </div>

  <div class="lock-icon-wrap"
    [class.is-unlocked]="lockState === true"
    [class.is-locked]="lockState === false"
    [class.animating]="animating">

    <div class="shackle"></div>

    <div class="lock-body">
      <div class="keyhole">
        <div class="keyhole-circle"></div>
        <div class="keyhole-slot"></div>
      </div>
    </div>
  </div>

  <div class="state-label"
    [class.warn]="lockState === true"
    [class.ok]="lockState === false">
    <ng-container *ngIf="lockState === false">SECURED</ng-container>
    <ng-container *ngIf="lockState === true">OPEN</ng-container>
    <ng-container *ngIf="lockState === null">UNKNOWN</ng-container>
  </div>

  <div class="lock-btns">
    <!-- Lock => DS1=false -->
    <button class="btn btn-unlock"
      [disabled]="busy || lockState === false"
      (click)="setDs1(false)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Lock
    </button>

    <!-- Unlock => DS1=true -->
    <button class="btn btn-lock"
      [disabled]="busy || lockState === true"
      (click)="setDs1(true)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
      Unlock
    </button>
  </div>

  <div class="status-msg"
    [class.ok]="lastOk === true"
    [class.err]="lastOk === false">
    <ng-container *ngIf="lastOk === true">✓ Command sent</ng-container>
    <ng-container *ngIf="lastOk === false">✗ {{ lastError || 'Command failed' }}</ng-container>
    <ng-container *ngIf="lastOk === null">&nbsp;</ng-container>
  </div>

</div>
