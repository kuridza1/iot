<div class="gsg-shell">

  <!-- Header -->
  <div class="gsg-header">
    <span class="gsg-device">GSG-01</span>
    <span class="gsg-dot"
      [class.ok]="mag > 0.1 && mag < alarmThreshold"
      [class.err]="mag >= alarmThreshold">
    </span>
  </div>

  <!-- Wall + Nail -->
  <div class="wall-area">
    <div class="nail-wrap" [class.alarm]="mag >= alarmThreshold"
         [style.transform]="'translateX(' + swingPx + 'px)'">
      <div class="nail-head"></div>
      <div class="nail-stem"></div>
    </div>
  </div>

  <!-- Hanging icon -->
  <div class="hanger-area">
    <div class="hanger" [style.transform]="'translateX(' + swingPx + 'px)'">
      <div class="string"></div>

      <div class="slavska-icon"
           [class.alarm]="mag >= alarmThreshold"
           [style.--r]="rotateDeg + 'deg'"
           [style.transform]="'translateX(-50%) rotate(' + rotateDeg + 'deg)'">

        <div class="icon-interior">

          <!-- Saint Trifun SVG -->
          <svg class="saint-svg" viewBox="0 0 102 115" xmlns="http://www.w3.org/2000/svg">

            <defs>
              <linearGradient id="goldBg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#d4a010"/>
                <stop offset="40%"  stop-color="#b87a06"/>
                <stop offset="100%" stop-color="#6b4004"/>
              </linearGradient>
              <radialGradient id="haloGrad" cx="50%" cy="0%" r="60%">
                <stop offset="0%"  stop-color="#ffe878" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
              <linearGradient id="robeGreen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#2a5c30"/>
                <stop offset="100%" stop-color="#183820"/>
              </linearGradient>
              <linearGradient id="robeBrown" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#6b3c18"/>
                <stop offset="100%" stop-color="#4e2c10"/>
              </linearGradient>
              <radialGradient id="faceGrad" cx="50%" cy="40%" r="55%">
                <stop offset="0%"  stop-color="#c8966a"/>
                <stop offset="100%" stop-color="#9a6440"/>
              </radialGradient>
            </defs>

            <!-- Background -->
            <rect x="0" y="0" width="102" height="115" fill="#9a6b04"/>
            <rect x="4" y="4" width="94" height="107" rx="3" fill="url(#goldBg)"/>

            <!-- Halo glow -->
            <circle cx="51" cy="32" r="26" fill="url(#haloGrad)"/>
            <!-- Halo ring -->
            <circle cx="51" cy="32" r="22" fill="none" stroke="#ffd060" stroke-width="2" opacity="0.85"/>
            <circle cx="51" cy="32" r="19" fill="none" stroke="#e8b840" stroke-width="0.7" opacity="0.5"/>
            <!-- Cross in halo -->
            <line x1="51" y1="13" x2="51" y2="21" stroke="#ffd060" stroke-width="1.5" opacity="0.7"/>
            <line x1="47" y1="17" x2="55" y2="17" stroke="#ffd060" stroke-width="1.5" opacity="0.7"/>

            <!-- Body / robe — green peasant tunic (Trifun bio vinar/seljak) -->
            <path d="M20 70 Q23 55 31 50 L51 47 L71 50 Q79 55 82 70 L86 112 L16 112 Z"
                  fill="url(#robeGreen)" opacity="0.95"/>

            <!-- Brown belt/sash across waist -->
            <rect x="18" y="74" width="66" height="7" rx="2" fill="url(#robeBrown)" opacity="0.85"/>
            <!-- Belt buckle hint -->
            <rect x="47" y="75" width="8" height="5" rx="1" fill="#c8a040" opacity="0.7"/>

            <!-- Robe fold lines -->
            <line x1="38" y1="55" x2="33" y2="112" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
            <line x1="51" y1="55" x2="51" y2="112" stroke="rgba(0,0,0,0.12)" stroke-width="0.7"/>
            <line x1="64" y1="55" x2="69" y2="112" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>

            <!-- Left hand holding vine branch (Trifun atribut — loza) -->
            <path d="M22 68 Q20 72 22 77 Q26 80 30 77 Q32 72 30 68 Z"
                  fill="#c07848" stroke="#a05830" stroke-width="0.4"/>
            <!-- Vine/branch in left hand -->
            <path d="M24 62 Q22 56 26 50 Q30 44 28 38"
                  stroke="#3a6820" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- Vine leaves -->
            <ellipse cx="28" cy="50" rx="5" ry="3.5" fill="#4a8830" transform="rotate(-30 28 50)" opacity="0.9"/>
            <ellipse cx="25" cy="43" rx="4" ry="3" fill="#3a7020" transform="rotate(20 25 43)" opacity="0.9"/>
            <ellipse cx="30" cy="38" rx="4" ry="2.5" fill="#4a8830" transform="rotate(-15 30 38)" opacity="0.85"/>
            <!-- Small grape cluster -->
            <circle cx="29" cy="55" r="2" fill="#6a2890" opacity="0.8"/>
            <circle cx="32" cy="53" r="1.8" fill="#7a3098" opacity="0.8"/>
            <circle cx="27" cy="53" r="1.8" fill="#6a2890" opacity="0.75"/>
            <circle cx="30" cy="51" r="1.5" fill="#8034a0" opacity="0.75"/>

            <!-- Right hand — blessing gesture -->
            <path d="M69 68 Q78 66 80 72 Q79 79 74 79 Q70 79 69 75 Z"
                  fill="#c07848" stroke="#a05830" stroke-width="0.4"/>
            <!-- Finger details -->
            <line x1="72" y1="68" x2="73" y2="64" stroke="#a05830" stroke-width="0.8" stroke-linecap="round"/>
            <line x1="75" y1="67" x2="76" y2="63" stroke="#a05830" stroke-width="0.8" stroke-linecap="round"/>
            <line x1="78" y1="68" x2="79" y2="65" stroke="#a05830" stroke-width="0.8" stroke-linecap="round"/>

            <!-- Neck -->
            <rect x="45" y="44" width="12" height="8" rx="3" fill="#b87858"/>

            <!-- Face — young, beardless (Trifun je bio mlad kada je mučen) -->
            <ellipse cx="51" cy="33" rx="13" ry="15" fill="url(#faceGrad)"/>

            <!-- Cheek shadow -->
            <ellipse cx="43" cy="36" rx="4" ry="5" fill="rgba(0,0,0,0.07)"/>
            <ellipse cx="59" cy="36" rx="4" ry="5" fill="rgba(0,0,0,0.07)"/>

            <!-- Eyes — wide, direct gaze -->
            <ellipse cx="46" cy="31" rx="3.8" ry="2.8" fill="#1a1008"/>
            <ellipse cx="56" cy="31" rx="3.8" ry="2.8" fill="#1a1008"/>
            <ellipse cx="46.6" cy="31" rx="1.6" ry="1.3" fill="#e8dcc8"/>
            <ellipse cx="56.6" cy="31" rx="1.6" ry="1.3" fill="#e8dcc8"/>
            <circle cx="47" cy="31" r="1" fill="#080604"/>
            <circle cx="57" cy="31" r="1" fill="#080604"/>
            <!-- Eye highlight -->
            <circle cx="47.8" cy="30.3" r="0.5" fill="rgba(255,255,255,0.6)"/>
            <circle cx="57.8" cy="30.3" r="0.5" fill="rgba(255,255,255,0.6)"/>

            <!-- Eyebrows — youthful, arched -->
            <path d="M42 27 Q46 25 50 27" stroke="#3a2008" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            <path d="M52 27 Q56 25 60 27" stroke="#3a2008" stroke-width="1.3" fill="none" stroke-linecap="round"/>

            <!-- Nose — young, smaller -->
            <path d="M50 31 Q49 36 48 37.5 Q51 39 54 37.5 Q53 36 52 31"
                  fill="rgba(0,0,0,0.09)"/>
            <path d="M48.5 37.5 Q51 39.5 53.5 37.5" stroke="#8a5030" stroke-width="0.8" fill="none"/>

            <!-- Mouth — calm, serene youth -->
            <path d="M47 41 Q51 43 55 41" stroke="#8a4030" stroke-width="1" fill="none" stroke-linecap="round"/>

            <!-- NO beard — Trifun je prikazivan kao mlad bezbradni momak -->

            <!-- Hair — dark, short, slightly wavy -->
            <path d="M38 28 Q39 15 51 13 Q63 15 64 28 Q61 19 51 18 Q41 19 38 28Z"
                  fill="#1e1008" opacity="0.9"/>
            <!-- Hair texture lines -->
            <path d="M42 20 Q45 16 51 15" stroke="#2e1810" stroke-width="0.6" fill="none" opacity="0.5"/>
            <path d="M60 20 Q57 16 51 15" stroke="#2e1810" stroke-width="0.6" fill="none" opacity="0.5"/>

            <!-- Inscription band -->
            <rect x="4" y="100" width="94" height="11" fill="rgba(0,0,0,0.38)"/>
            <text x="51" y="109" text-anchor="middle"
                  font-family="serif" font-size="6" font-style="italic"
                  fill="#e8c870" opacity="0.92">Свети Трифун</text>

            <!-- Decorative corner motifs -->
            <path d="M8 8 L16 8 L8 16 Z"  fill="rgba(255,215,80,0.2)"/>
            <path d="M94 8 L86 8 L94 16 Z" fill="rgba(255,215,80,0.2)"/>
            <path d="M8 107 L16 107 L8 99 Z"  fill="rgba(255,215,80,0.2)"/>
            <path d="M94 107 L86 107 L94 99 Z" fill="rgba(255,215,80,0.2)"/>

            <!-- Border bands -->
            <rect x="10" y="5"   width="82" height="3" rx="1" fill="rgba(255,215,80,0.15)"/>
            <rect x="10" y="107" width="82" height="3" rx="1" fill="rgba(255,215,80,0.15)"/>
          </svg>

          <!-- Craquelure overlay -->
          <div class="crackle"></div>
          <!-- Varnish sheen -->
          <div class="varnish"></div>

        </div>
      </div><!-- slavska-icon -->

    </div><!-- hanger -->
  </div><!-- hanger-area -->

  <!-- Readout -->
  <div class="readout">
    <div class="readout-line">
      <span class="k">GSG</span>
      <span class="v">{{ magLabel }}</span>
    </div>
    <div class="readout-line subtle" *ngIf="lastTs">
      <span class="k">ts</span>
      <span class="v">{{ lastTs | date:'HH:mm:ss' }}</span>
    </div>
    <div class="readout-line warn" *ngIf="mag >= alarmThreshold">
      <span class="k">ALARM</span>
      <span class="v">threshold reached</span>
    </div>
  </div>

</div>
